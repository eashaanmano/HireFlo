name: Refresh demo data

# Re-seeds the hosted database (Neon) so the AMD drive is live "right now" again. The demo season is built around
# the moment it is seeded, so run this shortly before showing the hosted site: Actions > Refresh demo data >
# Run workflow, or `gh workflow run refresh-demo.yml`. It also runs every morning at 08:00 IST.
# Needs the repository secret DEMO_DATABASE_URL (the same Neon URL as on Render) and, optionally, the repository
# variable DEMO_URL (the site's address) to wake the free instance afterwards.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: refresh-demo
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      PUBLIC_URL: ${{ vars.DEMO_URL }}
      UPLOAD_DIR: /tmp/hireflo-uploads
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Add the DEMO_DATABASE_URL secret to refresh the hosted demo. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Re-seed the hosted database
        if: steps.cfg.outputs.ready == 'true'
        # The seed prints magic links signed with this runner's throwaway key; they are not valid on the site
        # (copy recruiter and panel links from the drive page instead), so only the summary is shown.
        run: |
          python -m app.seed --reset > /tmp/seed.log 2>&1 || { cat /tmp/seed.log; exit 1; }
          grep -E "^Imported" /tmp/seed.log
      - name: Wake the site
        if: steps.cfg.outputs.ready == 'true' && vars.DEMO_URL != ''
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$PUBLIC_URL/api/health"
